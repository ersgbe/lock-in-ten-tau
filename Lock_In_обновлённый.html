<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}</style>
<title>Lock In</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'16'%20fill%3D'%230a0a0c'%2F%3E%3Cpath%20d%3D'M22%2014v30h22'%20fill%3D'none'%20stroke%3D'%23f3f2ef'%20stroke-width%3D'7'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%2F%3E%3Ccircle%20cx%3D'46'%20cy%3D'20'%20r%3D'5'%20fill%3D'%23f0a35a'%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@300;400;500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: строгая сетка, один шаг отступа (--gap) между всеми блоками, один внутренний (--gap-in), три радиуса: карточка, вложенный элемент, пилюля.
   Тёмно-зелёная графитовая палитра, один тёплый акцент, плоские панели без свечений. Фиксированный экран без прокрутки, календарь раскрывается внизу */
:root{
  --bg:#0b0b0c; --panel:rgba(255,255,255,.055); --inner:rgba(255,255,255,.07); --inner-hi:rgba(255,255,255,.12);
  --fg:#f2f2f0; --muted:#a8a8ae; --faint:#86868c;
  --line:rgba(255,255,255,.1); --line-hi:rgba(255,255,255,.22);
  --accent:#ff6a13; --accent-soft:rgba(255,106,19,.14); --accent-ink:#ff9a5c;
  --good:#d6d6d2; --bad:#ff8a73;
  --ink:#0b0b0c; --pill:#f2f2f0;
  --hl:rgba(255,255,255,.15); --hl-line:rgba(255,255,255,.26);
  --c0:#eef1ef; --c1:#ff6a13; --c2:#8fb4ff; --c3:#b4b4ba; --c4:#c9a8f0; --c5:#ff8a73;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --gap:12px; --gap-in:8px; --pad:16px; --pad-in:12px;
  --r:20px; --ri:14px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:transparent;color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;min-height:100%;
  padding-left:max(36px,env(safe-area-inset-left,0px));padding-right:max(36px,env(safe-area-inset-right,0px));padding-block:36px 48px}
*{box-sizing:border-box}

/* фон: ровный графит с едва заметной подсветкой сверху */
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:#161514}
.bgfx svg{position:absolute;inset:0;width:100%;height:100%}
.bgfx::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,.2) 20%,rgba(0,0,0,.7) 100%),rgba(5,5,6,.55)}

.wrap{max-width:1380px;margin:0 auto;display:grid;gap:var(--gap);padding:var(--gap);border-radius:32px;background:rgba(22,21,20,.42);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(38px) saturate(130%);-webkit-backdrop-filter:blur(38px) saturate(130%);box-shadow:0 60px 130px rgba(0,0,0,.65),0 10px 36px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14);
  grid-template-columns:minmax(0,1fr) 340px;
  grid-template-areas:"top top" "budget goals" "stage lock" "calbtn calbtn" "cal cal"}
.topline{grid-area:top;display:flex;justify-content:space-between;align-items:center;gap:var(--gap);flex-wrap:wrap;min-height:40px}
.topline .right{display:flex;align-items:center;gap:var(--gap-in);flex-wrap:wrap}
.budget{grid-area:budget;display:flex;flex-direction:column}.budget-grid{flex:1}
.card.stagebox{grid-area:stage;display:flex;flex-direction:column;min-height:0;background:var(--hl);border-color:var(--hl-line);--inner:rgba(0,0,0,.2);--inner-hi:rgba(255,255,255,.12);--muted:#bcbcc2;--line:rgba(255,255,255,.1)}
.goalsbox{grid-area:goals}.lockin{grid-area:lock}.incbox{grid-area:inc}
.calbtn{grid-area:calbtn;width:100%;display:flex;align-items:center;justify-content:center;gap:var(--gap-in);padding:14px;font-size:14px}
.btn.calbtn{background:rgba(8,8,9,.8);border-color:rgba(255,255,255,.12)}
.btn.calbtn[aria-expanded=true]{background:var(--pill)}
.calbtn i{font-style:normal;transition:transform .2s}
.calbtn[aria-expanded=true] i{transform:rotate(180deg)}
.cal{grid-area:cal}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "budget" "goals" "stage" "lock" "calbtn" "cal"}
}
/* на большом экране всё помещается в один экран без прокрутки, пока календарь закрыт */
@media (min-width:901px) and (min-height:800px){
  html,body{height:100%}
  body{padding-block:36px}
  body:not(.cal-open){overflow:hidden}
  .wrap{height:calc(100dvh - 72px);grid-template-rows:auto auto minmax(0,1fr) auto auto}
  body.cal-open .wrap{height:auto;min-height:calc(100dvh - 72px)}
  .lockin{min-height:0}
  #stage{overflow:auto;scrollbar-width:none;flex:1;min-height:0}
  #stage::-webkit-scrollbar{display:none}
}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);min-width:0}
.label{font-size:13px;color:var(--muted);font-weight:500}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:var(--gap-in);margin-bottom:var(--gap)}
.empty{color:var(--muted);margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--inner-hi);border-radius:99px;padding:4px 10px;font-size:12px;color:var(--fg);white-space:nowrap}
.chip.hot{background:var(--accent-soft);color:var(--accent-ink)}
.chip.done{background:rgba(255,255,255,.1);color:var(--fg)}
.chip.late{background:rgba(255,138,115,.14);color:var(--bad)}
.today-big{font-family:var(--f-display);font-weight:300;font-size:22px;margin:0;letter-spacing:-.01em}
#status{color:var(--muted);font-size:12px}
.peek{display:flex;align-items:center;gap:var(--gap-in);font-size:12px;color:var(--muted)}
.peek .in{width:auto}
select.in{appearance:auto}

.btn{border:0;border-radius:99px;padding:10px 18px;background:var(--pill);color:var(--ink);font:600 13px/1 var(--f-body);cursor:pointer;white-space:nowrap;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--line-hi)}
.btn.ghost:hover{background:var(--inner)}
.btn.ghost[aria-expanded=true]{background:var(--pill);color:var(--ink)}
.btn.sm{padding:9px 14px}
.in{background:var(--inner);border:1px solid var(--line);border-radius:99px;color:var(--fg);padding:9px 14px;font:500 13px var(--f-body);min-width:0;width:100%}
.in::placeholder{color:var(--faint)}
.in:focus{border-color:var(--line-hi);outline:none}
.in[type=date]{font-family:var(--f-mono);font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;padding:4px 6px;border-radius:8px;flex:none}
.x:hover{color:var(--fg);background:var(--inner-hi)}
.x[data-armed]{color:var(--bad);font-size:12px;font-weight:600}

.bar{height:6px;border-radius:99px;background:var(--inner-hi);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:inherit;background:var(--fg);transition:width .5s}
.bar.good>span{background:var(--good)}

/* деньги */
.budget-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 56px;gap:var(--gap-in);align-items:stretch}
@media (max-width:760px){.budget-grid{grid-template-columns:minmax(0,1fr)}.plus{min-height:48px}}
#budgets{display:contents}
.money{display:flex;flex-direction:column;justify-content:flex-start;gap:var(--gap-in);padding:var(--pad-in);border-radius:var(--ri);min-width:0;background:var(--inner);border:1px solid var(--line)}
.money .parts{margin-top:auto}
.money.focus{background:var(--hl);border-color:var(--hl-line);--inner:rgba(0,0,0,.2);--inner-hi:rgba(255,255,255,.12);--muted:#bcbcc2;--line:rgba(255,255,255,.1)}
.money-head{display:flex;justify-content:space-between;align-items:center;gap:var(--gap-in)}
.money-sum{display:flex;align-items:baseline;gap:var(--gap-in);flex-wrap:wrap}
.money-sum b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.money-sum span{color:var(--muted);font-size:12px}
.money-meta{display:flex;justify-content:space-between;gap:var(--gap-in);flex-wrap:wrap;color:var(--muted);font-size:12px}
.money-meta .num{color:var(--fg)}
.parts{display:grid;grid-template-columns:repeat(3,max-content);justify-content:start;gap:6px;min-height:26px}
.parts .part{display:flex;align-items:center;justify-content:flex-start;text-align:left}
.parts .part:last-child:nth-child(3n+1){grid-column:1/-1}
.part{border:0;background:var(--inner-hi);color:var(--fg);border-radius:99px;padding:4px 10px;font:500 11px var(--f-body);cursor:pointer}
.part b{font-family:var(--f-mono);font-weight:500;margin-left:4px}
.part.paid{color:var(--faint);text-decoration:line-through}
.plus{border-radius:var(--ri);border:1px solid var(--line-hi);background:transparent;color:var(--fg);font:300 28px/1 var(--f-body);cursor:pointer;display:grid;place-items:center}
.plus button{border:0;background:transparent;color:var(--fg);font:300 28px/1 var(--f-body);cursor:pointer;display:grid;place-items:center}
.plus button:hover{background:var(--inner)}
.plus button+button{border-top:1px solid var(--line)}
.plus{padding:0;overflow:hidden;grid-template-rows:1fr 1fr;place-items:stretch}
.inc-form{display:flex;flex-direction:column;gap:var(--gap-in)}

/* сейчас в работе */
.stage-list{display:flex;flex-direction:column;gap:var(--gap)}
.stage-list.multi{display:flex;flex-direction:column;gap:var(--gap)}
.stage-title{font-family:var(--f-display);font-weight:300;font-size:clamp(30px,6vh,60px);line-height:1.05;margin:0 0 var(--gap);letter-spacing:-.02em;overflow-wrap:anywhere}
.multi .stage-title{font-size:clamp(20px,3.2vh,30px);margin-bottom:var(--gap-in)}
.stage-goals{display:flex;flex-wrap:wrap;gap:var(--gap-in);margin-top:var(--gap)}
.stage-goals .chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;white-space:normal;background:rgba(255,106,19,.13);color:var(--fg);border:1px solid rgba(255,106,19,.5);border-radius:var(--ri);padding:var(--pad-in) var(--pad);font:600 20px/1.25 var(--f-body)}
.stage-goals .chip::before{content:"Цель на день";margin:0;color:var(--accent-ink);font:600 12px var(--f-body)}
/* на низких окнах всё равно помещается */
@media (min-width:901px) and (min-height:800px) and (max-height:860px){
  .stage-title{font-size:clamp(26px,5vh,44px);margin-bottom:var(--gap-in)}
  .points{gap:6px}.points li{padding:8px 12px;font-size:14px}
  .stage-goals{margin-top:var(--gap-in)}.stage-goals .chip{padding:8px 12px;font-size:17px}
}
.points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--gap-in)}
.points li{display:flex;align-items:center;gap:var(--gap-in);padding:var(--pad-in);border-radius:var(--ri);background:var(--inner);border:1px solid var(--line);font-size:15px;font-weight:500;overflow-wrap:anywhere}
.points li span{flex:1;min-width:0}
.points li.done{opacity:.45}
.points li.done span{text-decoration:line-through}
.mark{flex:none;border:1px solid var(--line-hi);background:transparent;color:var(--fg);border-radius:99px;padding:5px 12px;font:600 12px var(--f-body);cursor:pointer}
.mark:hover{background:var(--inner-hi)}
.points li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}

/* цели: только показ */
.goalsbox .label{color:var(--fg);font-weight:600;font-size:14px}
.goal{display:flex;align-items:center;gap:var(--gap-in)}
.goal::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);flex:none}
.goal{padding:var(--pad-in);border-radius:var(--ri);background:var(--inner);border:1px solid var(--line);font-size:15px;font-weight:600;overflow-wrap:anywhere}
.list{display:flex;flex-direction:column;gap:var(--gap-in)}
.lockin{display:flex;flex-direction:column;gap:var(--gap);justify-content:space-between;min-height:240px;background:rgba(8,8,9,.8)}
.lockin h2{font-family:var(--f-display);font-weight:300;text-transform:uppercase;font-size:clamp(30px,5.4vh,50px);line-height:1.02;margin:0;letter-spacing:-.02em}
.lock-meta{display:flex;justify-content:space-between;align-items:baseline;gap:var(--gap-in);color:var(--muted);font-size:12px}
.lock-meta b{font:400 24px var(--f-display);color:var(--fg)}
.inc{display:flex;align-items:center;gap:var(--gap-in);font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.inc:last-child{border-bottom:0}
.inc .d{color:var(--muted);font-size:12px;width:52px;flex:none}
.inc .t{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--muted)}
.inc .a{font-family:var(--f-mono);color:var(--good)}

/* календарь */
.cal-body{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--gap)}
@media (max-width:900px){.cal-body{grid-template-columns:minmax(0,1fr)}}
.cal-nav{display:flex;gap:var(--gap-in);align-items:center}
.cal-nav b{font:400 14px var(--f-display);min-width:130px;text-align:center}
.wd,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd span{text-align:center;font-size:12px;color:var(--faint);padding-bottom:4px}
.day{position:relative;height:54px;min-width:0;border-radius:var(--ri);border:1px solid var(--line);background:var(--inner);color:var(--fg);font:500 12px var(--f-mono);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px 5px;cursor:pointer}
.day:hover{border-color:var(--line-hi)}
.day.past{color:var(--faint)}
.day.today{background:var(--pill);color:var(--ink);border-color:var(--pill)}
.day.sel{border-color:var(--accent)}
.day.blank{visibility:hidden;pointer-events:none}
.marks{display:flex;flex-direction:column;gap:2px;width:100%;padding:0 4px}
.marks i{display:block;height:3px;border-radius:2px;background:var(--c)}
.dayinfo{display:flex;flex-direction:column;gap:var(--gap-in);margin-bottom:var(--gap)}
.dayrow{display:flex;align-items:flex-start;gap:var(--gap-in);font-size:13px}
.dayrow .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;margin-top:5px}
.dayrow .t{flex:1;min-width:0;overflow-wrap:anywhere}
.dayrow .t small{display:block;color:var(--muted);font-size:12px}
.addstage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap-in)}
.addstage .full{grid-column:1/-1}
.addstage .lbl{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* деньги: одна плашка, разделённая на четыре части */
.card.budget{padding:0;overflow:hidden}
.budget-grid{grid-template-columns:repeat(3,minmax(0,1fr)) 72px;gap:0}
.money{border:0;border-radius:0;background:transparent;padding:var(--pad)}
.money:not(:first-child){border-left:1px solid var(--line)}
.money.focus{background:var(--hl)}
.plus{border:0;border-left:1px solid var(--line);border-radius:0;grid-row:1 / 3}
.parts.parts-wide{grid-row:2;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:0;padding:var(--pad-in) var(--pad);border-top:1px solid var(--line)}
@media (max-width:760px){.money,.plus,.parts-wide{grid-row:auto!important;grid-column:auto!important}}
@media (max-width:760px){
  .budget-grid{grid-template-columns:minmax(0,1fr)}
  .money:not(:first-child),.plus{border-left:0;border-top:1px solid var(--line)}
}

/* окна */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(4,4,5,.72);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal-card{width:min(640px,100%);max-height:100%;overflow:auto;background:#1a1a1c;border:1px solid var(--line-hi);border-radius:var(--r);padding:var(--pad);display:flex;flex-direction:column;gap:var(--gap)}
.modal-card h2{font:300 clamp(22px,3.4vw,30px)/1.15 var(--f-display);margin:0}
.modal-card.small{width:min(420px,100%)}
.modal-card.small .card-h{margin:0}
.choices{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap-in)}
@media (max-width:520px){.choices{grid-template-columns:minmax(0,1fr)}}
.choice{text-align:left;cursor:pointer;border-radius:var(--ri);padding:var(--pad);border:1px solid var(--line-hi);background:var(--inner);color:var(--fg);font:inherit;display:flex;flex-direction:column;gap:6px}
.choice:hover{background:var(--inner-hi)}
.choice.yes{background:var(--pill);color:var(--ink);border-color:var(--pill)}
.choice .big{font:500 18px var(--f-display)}
.choice .small{font-size:13px;opacity:.75}

/* удаление: подтверждение */
.btn-row{display:flex;gap:var(--gap-in);justify-content:flex-end}
.btn.danger{background:var(--bad);color:#1a0a07}
#delText{font-size:20px}
#delModal{z-index:55}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:var(--gap);max-width:calc(100% - 32px);background:var(--pill);color:var(--ink);padding:8px 8px 8px 18px;border-radius:99px;font:600 13px var(--f-body)}
.toast .mark{border-color:rgba(0,0,0,.25);color:var(--ink)}
.toast .mark:hover{background:rgba(0,0,0,.08)}
.dayrow.sub{padding-left:17px;font-size:12px;color:var(--muted)}
.points li .x{padding:4px 8px}
/* правка и добавление задач прямо в блоке */
.ptext{flex:1;min-width:0;display:block;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;white-space:normal;overflow-wrap:anywhere;cursor:text;border-radius:4px}
.ptext:hover span{text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.points li.done .ptext:hover span{text-decoration:line-through}
.task-edit{flex:1;min-width:0;padding:0;border:0;border-bottom:1px solid var(--accent);background:none;color:var(--fg);font:inherit;outline:none}
.x svg{display:block;width:14px;height:14px}
.task-add{display:flex;flex-wrap:wrap;align-items:center;gap:var(--gap-in);padding:6px 6px 6px var(--pad-in);border:1px dashed var(--line-hi);border-radius:var(--ri)}
.task-add input{flex:1 1 180px;min-width:0;padding:0;border:0;background:none;color:var(--fg);font:500 15px var(--f-body);outline:none}
.task-add input::placeholder{color:var(--muted)}
.task-add:focus-within{border-style:solid;border-color:var(--accent)}
.task-add .mark{white-space:nowrap}
.task-add select{appearance:none;-webkit-appearance:none;flex:0 1 auto;max-width:100%;min-width:0;padding:6px 12px;background:var(--inner-hi);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:500 13px var(--f-body);cursor:pointer}
.task-add select option{background:#1a1a1c;color:#f2f2f0}
.task-add .newcat{flex:0 1 200px;border-bottom:1px solid var(--line-hi)}
/* цель на день в шапке блока, рядом с названием */
.stage-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--gap-in) var(--gap);margin-bottom:var(--gap)}
.stage-head .stage-title{margin:0}
.stage-head .stage-goals{margin:0;justify-content:flex-end;min-width:0;max-width:100%}
.stage-head .stage-goals .chip{width:auto;max-width:100%}

<script>
const RU_M=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const RU_MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const RU_WD=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
/* ключ постоянный: номер версии больше не меняем, чтобы обновления сайта не сбрасывали записи */
const LS_KEY='lockin-planner';
function loadLocal(){
  const read=k=>{try{const v=JSON.parse(localStorage.getItem(k));return v&&typeof v==='object'?v:null}catch(e){return null}};
  const cur=read(LS_KEY);if(cur)return cur;
  /* первый запуск после обновления: забираем записи из самой новой старой версии */
  let keys=[];try{keys=Object.keys(localStorage)}catch(e){}
  const old=keys.map(k=>({k,m:/^lockin-planner-v(\d+)$/.exec(k)})).filter(x=>x.m).sort((a,b)=>b.m[1]-a.m[1]);
  for(const x of old){const v=read(x.k);if(v){try{localStorage.setItem(LS_KEY,JSON.stringify(v))}catch(e){}return v}}
  return null;
}
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addMonths=(s,n)=>{const d=parse(s);d.setMonth(d.getMonth()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const human=s=>{const d=parse(s);return d.getDate()+' '+RU_M[d.getMonth()]};
const humanY=s=>{const d=parse(s);return d.getDate()+' '+RU_M[d.getMonth()]+' '+d.getFullYear()};
const money=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const short=n=>n>=1000?String(Math.round(n/100)/10).replace('.',',')+'к':Math.round(n)+' ₽';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const k=n%10;return n>10&&n<20?c:k>1&&k<5?b:k===1?a:c};
const dayWord=n=>plural(n,'день','дня','дней');
const colorOf=s=>{let h=0;for(const ch of s.id)h=(h*31+ch.charCodeAt(0))>>>0;return 'var(--c'+(h%6)+')'};

const SEED={
  budgets:[
    {id:'b9',from:'2026-11-01',deadline:'2026-11-09',time:'18:00',target:55000,parts:[{label:'Настя',amount:15000,paid:false},{label:'Квартира',amount:40000,paid:false}]},
    {id:'b10',from:'2026-11-01',deadline:'2026-11-12',time:'23:59',target:15000,parts:[{label:'Софа',amount:4000,paid:false},{label:'На жизнь',amount:10000,paid:false}]},
    {id:'bm',from:'2026-11-01',deadline:'2026-11-30',target:500000,note:'любыми способами'}
  ],
  income:[],
  categories:[
    {id:'sites',title:'Сайты',from:'2026-11-03',goals:[{text:'Найти 4 заказа по 5к',until:'2026-11-08'}]},
    {id:'p2p',title:'P2P',from:'2026-11-10',goals:[]},
    {id:'arb',title:'Арбитраж трафика',from:'2026-11-10',goals:[]},
    {id:'more',title:'Ещё',from:'2026-11-10',goals:[]}
  ],
  tasks:[],
  schema:4,
  decision:null,
  goals:[{id:'g1',title:'Заработать 500к'},{id:'g2',title:'Переехать в ахуенную квартиру'},{id:'g3',title:'Набрать 10 кг'}],
  lockIn:{start:'2026-11-03',months:6}
};

let S=null, mode='loading', ref=null, calOpen=false, peek='', lastEff='';
let folded={};try{folded=JSON.parse(localStorage.getItem('lockin-folded'))||{}}catch(e){folded={}}
function saveFolded(){try{localStorage.setItem('lockin-folded',JSON.stringify(folded))}catch(e){}}
let editId=null, editDraft='', addDraft={}, addCat='', addNewName='', stageRendering=false;
let today=iso(new Date());
let calY=parse(today).getFullYear(), calM=parse(today).getMonth(), sel=today;

function normalize(s){
  s=s&&typeof s==='object'?s:{};
  for(const k of ['budgets','income','categories','tasks','goals'])if(!Array.isArray(s[k]))s[k]=[];
  if(Array.isArray(s.stages)){
    for(const st of s.stages){
      let c=s.categories.find(x=>x.title===st.title);
      if(!c){c={id:st.id||uid(),title:st.title};s.categories.push(c)}
      for(const t of st.tasks||[])s.tasks.push({id:t.id||uid(),cat:c.id,title:t.title,start:st.start,end:st.end});
    }
    delete s.stages;
  }
  /* разовое обновление плана: цель на день и бюджеты редактируются только в коде, поэтому их можно менять,
     не трогая доходы и задачи. Отметки «закрыто» у частей бюджета сохраняются */
  if((s.schema||0)<2&&(s.categories.length||s.budgets.length)){
    const paid={};for(const b of s.budgets)for(const x of b.parts||[])if(x.paid)paid[b.id+':'+x.label]=true;
    s.budgets=JSON.parse(JSON.stringify(SEED.budgets));
    for(const b of s.budgets)for(const x of b.parts||[])x.paid=!!paid[b.id+':'+x.label];
    const seedGoals=(SEED.categories.find(c=>c.id==='sites')||{}).goals||[];
    for(const c of s.categories)delete c.goals;
    const site=s.categories.find(c=>c.id==='sites')||s.categories.find(c=>c.title==='Сайты');
    if(site)site.goals=JSON.parse(JSON.stringify(seedGoals));
    s.decision=null;
    s.schema=2;
  }
  /* версия 3: новые денежные цели и полная очистка списка задач */
  if((s.schema||0)<3){
    const monthly=s.budgets.find(b=>b.id==='bm')||JSON.parse(JSON.stringify(SEED.budgets.find(b=>b.id==='bm')));
    s.budgets=JSON.parse(JSON.stringify(SEED.budgets.slice(0,2)));
    s.budgets.push(monthly);
    s.tasks=[];
    s.schema=3;
  }
  /* версия 4: очищаем задачи и в уже сохранённых копиях */
  if((s.schema||0)<4){
    s.tasks=[];
    s.schema=4;
  }
  return s;
}
const sumIncome=(from,to)=>S.income.filter(i=>i.date>=from&&i.date<=to).reduce((a,i)=>a+(+i.amount||0),0);

function effDay(){const n=new Date();if(n.getHours()*60+n.getMinutes()>=1439){const d=new Date(n);d.setDate(d.getDate()+1);return iso(d)}return today}
function catVisible(c,day,ch){
  if(S.tasks.some(t=>t.cat===c.id&&t.start<=day&&day<=t.end))return true;
  const w=c.when?(c.when[ch]||null):(c.branch?(c.branch===ch?{from:c.from,until:c.until}:null):(c.from?{from:c.from,until:c.until}:undefined));
  if(w===undefined)return S.tasks.some(t=>t.cat===c.id&&t.start<=day&&day<=t.end);
  return !!w&&w.from<=day&&(!w.until||day<=w.until);
}

setInterval(()=>{if(!S)return;if(iso(new Date())!==today||effDay()!==lastEff)render();else renderDecision()},30000);
(async()=>{
  const timer=setTimeout(()=>{if(mode==='loading')setStatus('Хранилище пока не отвечает. План появится, как только связь восстановится.')},10000);
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){
    clearTimeout(timer);mode='local';
    S=loadLocal();
    S=normalize(S||SEED);setStatus('Сохраняется только в этом браузере');render();return;
  }
  ref=db.doc('planner/main');
  ref.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);if(mode==='loading')setStatus('')}
    if(writing||again)return;
    mode='db';
    S=normalize(snap.exists?JSON.parse(JSON.stringify(snap.data())):null);
    render();
  },err=>{clearTimeout(timer);setStatus('План сейчас недоступен. Обнови страницу позже.')});
})();
</script>
